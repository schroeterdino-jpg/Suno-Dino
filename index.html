<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Prompt & Songwriter AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="bg-stone-800 p-4 rounded-3xl border border-stone-700 shadow-lg flex justify-between items-center">
      <h1 class="text-base font-extrabold flex items-center gap-2">🎵 Suno Songwriter AI</h1>
      <button onclick="changeApiKey()" class="text-xs font-bold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-xl border border-amber-400/20">🔑 Key</button>
    </div>

    <!-- Einstellungen -->
    <div class="bg-stone-800 p-4 rounded-3xl border border-stone-700 space-y-3 shadow-lg">
      
      <!-- Genre -->
      <div>
        <label class="text-xs font-bold text-stone-300 block mb-1">Genre / Style</label>
        <select id="genre-select" class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500">
          <optgroup label="Balkan & Oriental & Osteuropa">
            <option value="Balkan Pop-Ballad, melancholic accordion, emotional strings, slow sad melody">Balkan / Rumänien Ballade (Traurig) 🌧️</option>
            <option value="Romanian Manele, energetic accordion, fast percussion, emotional synth">Romanian Manele (Party) 🇷🇴</option>
            <option value="Polish Disco Polo, fast synthesizer, catchy upbeat dance beat, energetic accordion">Disco Polo / Polish Dance 🇵🇱</option>
            <option value="Balkan Trap, brass section, heavy oriental synth, modern trap bass">Balkan Trap (Modern) 🎺</option>
            <option value="Turkish Pop/Rap, saz hooks, darbuka groove, modern trap bass">Turkish Pop-Rap 🪕</option>
            <option value="Turkish Ballad, acoustic saz, melancholic strings, slow emotional rhythm">Turkish Ballad 🪕</option>
          </optgroup>
          <optgroup label="Rap & Hip-Hop">
            <option value="French Afrotrap, bouncy 808, fast brass, melodic auto-tune">French Afrotrap 🇫🇷</option>
            <option value="Deutsch-Türkisch Rap, dark oriental trap beat, heavy bass, catchy hook">Deutsch-Türkisch Rap 🇩🇪🇹🇷</option>
            <option value="Deutschrap Drill, dark sliding 808, aggressive cadence, fast hi-hats">Deutschrap Drill 🔪</option>
            <option value="Oldschool Boom Bap, 90s hip-hop beat, vinyl crackle, classic flow">Oldschool Boom Bap 🎤</option>
            <option value="Melodic Trap, emotional melody, heavy bass">Melodic Trap 🎸</option>
          </optgroup>
          <optgroup label="Latin & Mediterranean">
            <option value="Reggaeton, dembow rhythm, catchy synth, urban latin beat">Reggaeton / Latin 🇪🇸</option>
            <option value="Italo Pop / Modern Trap, bouncy synth, catchy chorus, melodic vibe">Italo Pop / Modern Trap 🇮🇹</option>
            <option value="Latin Trap, heavy 808 bass, dark vibe">Latin Trap 🎸</option>
          </optgroup>
          <optgroup label="Dance & Electronic">
            <option value="90s Eurodance, fast synthesizer lead, energetic rhythm">90s Eurodance 🎧</option>
            <option value="Hands Up, Commercial Dance, pitched synth melody, fast beat">2000s Hands Up 🙌</option>
            <option value="Techno Peaktime, driving acid bassline, hard kick, raw rave vibe">Hard Techno / Rave ⚡</option>
            <option value="Deep House, smooth bassline, atmospheric pads, chill groove">Deep House 🍸</option>
          </optgroup>
          <optgroup label="Pop & Rock">
            <option value="80s Synthwave, retro analog synth, drum machine, nostalgic vibe">80s Synthwave 🌌</option>
            <option value="Pop Rock, driving drums, anthem hook">Pop Rock 🎸</option>
            <option value="Acoustic Singer-Songwriter, intimate warm feel">Acoustic Pop 🪕</option>
          </optgroup>
        </select>
      </div>

      <!-- Wunsch-Instrumente -->
      <div>
        <label class="text-xs font-bold text-stone-300 block mb-1">Eigene Instrumente / Sounds (Optional)</label>
        <input type="text" id="instruments-input" placeholder="z. B. Klavier, Geige, E-Gitarre, Synth..." class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500" />
      </div>

      <!-- Feineinstellungen: Sprache, Stimme & Tempo -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs font-bold text-stone-300 block mb-1">🗣️ Sprache</label>
          <select id="lang-select" class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500">
            <option value="Deutsch">Deutsch 🇩🇪</option>
            <option value="Deutsch und Polnisch gemischt">Deutsch-Polnisch 🇩🇪🇵🇱</option>
            <option value="Deutsch und Türkisch gemischt">Deutsch-Türkisch 🇩🇪🇹🇷</option>
            <option value="Deutsch und Rumänisch gemischt">Deutsch-Rumänisch 🇩🇪🇷🇴</option>
            <option value="Deutsch und Spanisch gemischt">Deutsch-Spanisch 🇩🇪🇪🇸</option>
            <option value="Deutsch und Italienisch gemischt">Deutsch-Italienisch 🇩🇪🇮🇹</option>
            <option value="Deutsch und Englisch gemischt">Deutsch-Englisch 🇩🇪🇬🇧</option>
            <option value="Polnisch">Polnisch 🇵🇱</option>
            <option value="Englisch">Englisch 🇬🇧</option>
            <option value="Türkisch">Türkisch 🇹🇷</option>
            <option value="Rumänisch">Rumänisch 🇷🇴</option>
            <option value="Spanisch">Spanisch 🇪🇸</option>
            <option value="Italienisch">Italienisch 🇮🇹</option>
            <option value="Französisch">Französisch 🇫🇷</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-stone-300 block mb-1">🎤 Stimme</label>
          <select id="vocal-select" class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500">
            <option value="male vocals">Männlich 👨</option>
            <option value="female vocals">Weiblich 👩</option>
            <option value="duet, male and female vocals">Duett 🧑‍🤝‍🧑</option>
            <option value="no vocals, instrumental">Instrumental 🎼</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-stone-300 block mb-1">⚡ Tempo</label>
          <select id="tempo-select" class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500">
            <option value="128 bpm, fast pace">Schnell (128 BPM)</option>
            <option value="140 bpm, fast energetic tempo">Extrem (140 BPM)</option>
            <option value="95 bpm, mid-tempo groove">Mittel (95 BPM)</option>
            <option value="75 bpm, slow tempo">Langsam (75 BPM)</option>
          </select>
        </div>
      </div>

      <!-- Stimmung -->
      <div>
        <label class="text-xs font-bold text-stone-300 block mb-1">Stimmung / Vibe</label>
        <select id="vibe-select" class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500">
          <option value="Melancholic, emotional, deep storyline">Melancholisch & Traurig 🌧️</option>
          <option value="Summer Club Hit, energetic, party vibes">Sommer & Party 🎉</option>
          <option value="Aggressive, high energy, fast flow">Aggressiv & Power ⚡</option>
          <option value="Motivational, uplifting, inspiring anthem">Motivation & Power 💪</option>
          <option value="Dark, mysterious, heavy atmosphere">Dunkel & Mystisch 🖤</option>
        </select>
      </div>

      <!-- Thema / Stichworte -->
      <div>
        <label class="text-xs font-bold text-stone-300 block mb-1">Thema / Stichworte / Eigene Vorgaben</label>
        <input type="text" id="topic-input" placeholder="z. B. Vermissen, Dino am Start, Sommer..." class="w-full bg-stone-700 border border-stone-600 rounded-xl p-2.5 text-xs font-bold text-white focus:outline-none focus:border-red-500" />
      </div>

      <button onclick="generateSong()" id="generate-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold p-3 rounded-2xl text-xs shadow-md transition-all">
        🚀 Song & Suno Prompt Generieren
      </button>
    </div>

    <!-- Output Bereich -->
    <div id="output-section" class="space-y-3 hidden">
      
      <!-- Songtitel -->
      <div class="bg-stone-800 p-4 rounded-3xl border border-stone-700 space-y-2 shadow-lg">
        <div class="flex justify-between items-center">
          <span class="text-xs font-extrabold text-red-400 uppercase tracking-wider">Songtitel (Suno)</span>
          <button onclick="copyToClipboard('title-output')" class="bg-stone-700 hover:bg-stone-600 text-xs font-bold px-2.5 py-1 rounded-xl">📋 Kopieren</button>
        </div>
        <input type="text" id="title-output" class="w-full text-xs font-bold bg-stone-900 p-3 rounded-xl border border-stone-700/80 text-amber-400 focus:outline-none focus:border-red-500">
      </div>

      <!-- Suno Style Prompt -->
      <div class="bg-stone-800 p-4 rounded-3xl border border-stone-700 space-y-2 shadow-lg">
        <div class="flex justify-between items-center">
          <span class="text-xs font-extrabold text-red-400 uppercase tracking-wider">Suno Style Prompt (Bearbeitbar)</span>
          <button onclick="copyToClipboard('style-output')" class="bg-stone-700 hover:bg-stone-600 text-xs font-bold px-2.5 py-1 rounded-xl">📋 Kopieren</button>
        </div>
        <textarea id="style-output" rows="3" class="w-full text-xs font-mono bg-stone-900 p-3 rounded-xl border border-stone-700/80 text-stone-200 focus:outline-none focus:border-red-500 resize-y"></textarea>
      </div>

      <!-- Songtext -->
      <div class="bg-stone-800 p-4 rounded-3xl border border-stone-700 space-y-2 shadow-lg">
        <div class="flex justify-between items-center">
          <span class="text-xs font-extrabold text-red-400 uppercase tracking-wider">Songtext (Bearbeitbar)</span>
          <button onclick="copyToClipboard('lyrics-output')" class="bg-stone-700 hover:bg-stone-600 text-xs font-bold px-2.5 py-1 rounded-xl">📋 Kopieren</button>
        </div>
        <textarea id="lyrics-output" rows="12" class="w-full text-xs font-mono bg-stone-900 p-3 rounded-xl border border-stone-700/80 text-stone-200 focus:outline-none focus:border-red-500 resize-y custom-scrollbar"></textarea>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
